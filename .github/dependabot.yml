version: 2
updates:
  # Only the actions the workflows use. Swift packages are pinned to exact
  # versions in the Xcode project and upgraded by hand: Dependabot can move
  # Package.resolved without the project's requirement, which Xcode then
  # resolves back to the old version.
  # One pull request a week, and only minor and patch releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
