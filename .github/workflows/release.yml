name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The tag may carry a suffix such as -rc1; the app version does not.
          base="${tag%%-*}"
          # The test target keeps its own 1.0; the app and its XPC helper must
          # agree on a single version.
          version="$(
            grep -oE 'MARKETING_VERSION = [^;]+;' boringNotch.xcodeproj/project.pbxproj \
              | sed -E 's/MARKETING_VERSION = ([^;]+);/\1/' \
              | sort -u \
              | grep -vx '1.0'
          )"
          echo "tag=$tag base=$base MARKETING_VERSION=$version"
          test "$(printf '%s\n' "$version" | wc -l | tr -d ' ')" = "1"
          test "$base" = "$version"

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Test the AI usage collectors
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      # Releases are signed with a self-signed certificate kept in the
      # repository's secrets. macOS ties the permissions it grants
      # (Accessibility, Full Disk Access) to the bundle ID and this
      # certificate, so they survive an update; an ad hoc signature would tie
      # them to the code hash, which changes with every build. There is no
      # Developer ID, so the app is still not notarized and the release notes
      # say how to open it.
      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.NEKONOTCH_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NEKONOTCH_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          # The certificate is self-signed, so it is untrusted and absent
          # from the valid identities; sign by its SHA-1 instead.
          identity="$(security find-certificate -c "NekoNotch Release Signing" -Z "$keychain" | awk '/SHA-1/ { print $3 }')"
          test -n "$identity"
          {
            echo "CODE_SIGN_IDENTITY = $identity"
            echo "CODE_SIGN_IDENTITY[sdk=macosx*] = $identity"
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM ="
            echo "OTHER_CODE_SIGN_FLAGS = --keychain $keychain"
          } > "$RUNNER_TEMP/ReleaseSigning.xcconfig"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            -xcconfig "$RUNNER_TEMP/ReleaseSigning.xcconfig" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO

      # Stops a release signed by anything but the release certificate.
      - name: Verify the signature
        run: |
          app=build/Build/Products/Release/NekoNotch.app
          codesign --verify --deep --strict "$app"
          fingerprint="$(printf '%s' "$SIGNING_IDENTITY" | tr '[:upper:]' '[:lower:]')"
          for bundle in "$app" "$app/Contents/XPCServices/BoringNotchXPCHelper.xpc"; do
            requirement="$(codesign -d -r - "$bundle" 2>&1 | grep designated)"
            echo "$requirement"
            echo "$requirement" | grep -q "H\"$fingerprint\""
          done

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Prepare artifacts
        id: artifacts
        run: |
          # Named after the tag so the file still says what it is once it is in
          # someone's downloads folder, and so the checksum file names the same
          # file the release actually carries.
          asset="NekoNotch-$GITHUB_REF_NAME.zip"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/NekoNotch.app \
            "artifacts/$asset"
          cd artifacts
          shasum -a 256 "$asset" > "$asset.sha256"
          {
            echo "asset=$asset"
            echo "checksum=$(cut -d' ' -f1 "$asset.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKSUM: ${{ steps.artifacts.outputs.checksum }}
          ASSET: ${{ steps.artifacts.outputs.asset }}
        run: |
          # A tag carrying a suffix such as v1.2.0-rc1 is published as a
          # prerelease, which keeps it out of "latest" and therefore out of the
          # in-app update check.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          echo "ref=$GITHUB_REF_NAME prerelease=${prerelease:-no}"
          cat > notes.md <<EOF
          NekoNotch is not notarized. After unzipping it and moving it to
          Applications, open it the first time with right-click → Open, or run:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/NekoNotch.app
          \`\`\`

          SHA-256 (\`$ASSET\`): \`$CHECKSUM\`
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "artifacts/$ASSET" \
            "artifacts/$ASSET.sha256"
