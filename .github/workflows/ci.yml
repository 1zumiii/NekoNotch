name: CI

on:
  push:
    branches:
      - custom-main
    # Documentation and images cannot break the build, so they do not spend a
    # run. A push that also touches anything else still triggers one.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Test the AI usage collectors
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      # The Swift packages would otherwise be fetched and resolved on every
      # run. Keyed on the pinned versions, so an update starts a new cache.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('boringNotch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # One build only: the tests need a Debug build of the app, which also
      # proves the project compiles. The universal Release build is left to
      # the release workflow. Signed ad hoc, as the runner has no certificate.
      # The tests are hosted by the app, so they start a real instance of it
      # on the runner; nothing there reacts to it.
      - name: Build and test
        run: |
          xcodebuild test \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation
